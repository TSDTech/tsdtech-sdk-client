server {
    listen 8080;
    # server_name _;  # Wildcard para Cloud Run ou local

    root /usr/share/nginx/html;
    index index.html;

    # Handle all requests (no-cache para entry points como /index.html e /version.json)
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        
        # SPA fallback: serve index.html para paths desconhecidos (ex: /alguma/rota)
        try_files $uri $uri/ /index.html;
    }

    # Immutable caching para assets versionados (matches /<short_sha>/*, case-insensitive hex)
    location ~ ^/[0-9a-fA-F]+/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }
}