name: tsdtech_sdk_ui
description: Flutter UI widgets for TSDTech payment integration. Drop-in checkout components for Flutter apps.
version: 0.1.0
publish_to: 'none'
repository: https://github.com/tsdtech/tsdtech-sdk-ui
homepage: https://github.com/tsdtech/tsdtech-sdk-ui
issue_tracker: https://github.com/tsdtech/tsdtech-sdk-ui/issues
topics:
  - payment
  - ui
  - widgets
  - tsdtech

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.7
  intl: ^0.20.2
  open_filex: ^4.7.0
  path_provider: ^2.1.5
  qr_flutter: ^4.1.0
  tsdtech_client_sdk:
    path: ../
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0


